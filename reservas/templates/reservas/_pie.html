{% load i18n static %}
<footer class="bg-bosque-950 text-beige-100/80">
  <div class="mx-auto grid max-w-7xl gap-8 px-5 py-12 text-sm lg:grid-cols-3 lg:px-8" style="align-items:center">

    {# Logo + nombre #}
    <div class="flex items-center gap-4">
      <img src="{% static 'img/idea-logo2.png' %}" alt="" style="width:9rem;height:auto;flex-shrink:0">
      <div>
        <p class="font-medium text-white">Hospedaje Rural Pirque</p>
        <p class="text-[0.65rem] uppercase tracking-[0.2em] text-beige-100/60">{% translate "Descanso, naturaleza y memoria local" %}</p>
      </div>
    </div>

    {# Ubicación y contacto #}
    <div class="space-y-1 lg:text-center">
      <p>Pirque, {% translate "Región Metropolitana" %} · Chile</p>
      <p><a href="mailto:{{ sitio.email_contacto }}" class="underline-offset-4 hover:underline">{{ sitio.email_contacto }}</a></p>
    </div>

    {# Derechos #}
    <p class="lg:text-right">© 2026 Hospedaje Rural Pirque</p>
  </div>
</footer>
