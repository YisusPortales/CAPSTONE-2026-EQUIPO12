{% load i18n %}
{% if sitio.whatsapp_numero %}
{% translate "Hola, quisiera consultar por una estadía en Hospedaje Rural Pirque." as saludo_wa %}
{% translate "Escríbenos por WhatsApp" as texto_wa %}
<a class="wa-flotante" href="https://wa.me/{{ sitio.whatsapp_numero }}?text={{ saludo_wa|urlencode }}" target="_blank" rel="noopener noreferrer" aria-label="{{ texto_wa }}">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.2-5.4A8.4 8.4 0 1 1 21 11.5z"/></svg>
  <span>{{ texto_wa }}</span>
</a>
<style>
  .wa-flotante { position: fixed; right: 1rem; bottom: 1rem; z-index: 40; display: inline-flex; align-items: center; gap: .6rem; padding: .85rem 1.1rem; background: #1a9e4f; color: #fff; font-size: .8rem; font-weight: 500; letter-spacing: .08em; text-decoration: none; box-shadow: 0 8px 24px rgba(0,0,0,.35); transition: background .15s, transform .15s; }
  .wa-flotante:hover { background: #15853f; transform: translateY(-2px); }
  .wa-flotante:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  @media (max-width: 480px) { .wa-flotante span { display: none; } .wa-flotante { padding: .9rem; border-radius: 50%; } }
  @media (prefers-reduced-motion: reduce) { .wa-flotante { transition: none; } }
</style>
{% endif %}
